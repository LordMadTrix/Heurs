<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Résumé des Prestations — Heures Mensuelles</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="shared.css" />
  <style>
    body {
      background: var(--bg-page);
      padding: 0 0 40px;
    }

    .container {
      background: var(--bg-card);
      padding: 30px;
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border);
      max-width: 560px;
      margin: 30px auto;
      width: 100%;
    }

    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      gap: 10px;
      flex-wrap: wrap;
    }

    h1 {
      color: var(--primary);
      margin: 0;
      font-size: 22px;
      font-weight: 700;
    }

    .period-selector {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      align-items: center;
      background: var(--bg-alt);
      padding: 10px 14px;
      border-radius: var(--radius-sm);
    }

    .period-selector select,
    .period-selector input {
      height: 34px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 0 8px;
      font-family: inherit;
      font-size: 13px;
      background: #fff;
    }

    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 24px;
      padding: 16px;
      background: var(--bg-alt);
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
    }

    .info-item label {
      display: block;
      font-size: 10px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 2px;
    }

    .info-item span {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-main);
    }

    .stats {
      border-top: 2px solid var(--border);
      padding-top: 16px;
    }

    .stat-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #f1f5f9;
    }
    .stat-row:last-child { border-bottom: none; }

    .stat-label {
      font-size: 14px;
      color: var(--text-main);
    }

    .stat-value {
      font-size: 20px;
      font-weight: 700;
      color: var(--primary);
    }

    .stat-value.green { color: var(--success); }
    .stat-value.sm    { font-size: 16px; color: var(--text-main); }

    .km-section {
      margin-top: 18px;
      padding: 14px;
      background: var(--success-light);
      border-radius: var(--radius-sm);
      border: 1px solid #bbf7d0;
    }

    .km-section h3 {
      margin: 0 0 10px;
      font-size: 11px;
      font-weight: 700;
      color: #059669;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .km-row {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      padding: 4px 0;
    }

    .km-row .km-label { color: var(--text-muted); }
    .km-row .km-val   { font-weight: 700; color: var(--text-main); }
    .km-row.total     { border-top: 1px solid #bbf7d0; margin-top: 6px; padding-top: 8px; }
    .km-row.total .km-label { color: var(--text-main); font-weight: 600; }
    .km-row.total .km-val   { color: #059669; font-size: 16px; }

    .actions-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 24px;
    }

    @media print {
      .no-print { display: none !important; }
      body { background: white; padding: 0; }
      .container { box-shadow: none; border: none; max-width: 100%; padding: 0; margin: 0; }
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="header-row">
      <h1>📊 Résumé Mensuel</h1>
      <a href="index.html" class="btn secondary sm no-print">← Saisie des heures</a>
    </div>

    <!-- Sélecteur de mois -->
    <div class="period-selector no-print">
      <label style="font-size:12px; font-weight:600; color:var(--text-muted);">Afficher la période :</label>
      <select id="selectMois" onchange="changerPeriode()">
        <option value="0">Janvier</option>
        <option value="1">Février</option>
        <option value="2">Mars</option>
        <option value="3">Avril</option>
        <option value="4">Mai</option>
        <option value="5">Juin</option>
        <option value="6">Juillet</option>
        <option value="7">Août</option>
        <option value="8">Septembre</option>
        <option value="9">Octobre</option>
        <option value="10">Novembre</option>
        <option value="11">Décembre</option>
      </select>
      <input type="number" id="annee" min="2000" max="2099" style="width:75px;" onchange="changerPeriode()" />
    </div>

    <div class="info-grid">
      <div class="info-item"><label>Nom</label><span id="resNom">—</span></div>
      <div class="info-item"><label>Prénom</label><span id="resPrenom">—</span></div>
      <div class="info-item"><label>Période</label><span id="resPeriode">—</span></div>
      <div class="info-item"><label>Entreprise</label><span id="resEntreprise">—</span></div>
    </div>

    <div class="stats">
      <div class="stat-row">
        <span class="stat-label">Total des heures prestées</span>
        <span class="stat-value" id="resTotal">00:00</span>
      </div>
      <div class="stat-row">
        <span class="stat-label">Heures supplémentaires</span>
        <span class="stat-value" id="resSup">00:00</span>
      </div>
      <div class="stat-row">
        <span class="stat-label">Jours travaillés</span>
        <span class="stat-value sm" id="resJours">0 j</span>
      </div>
      <div class="stat-row">
        <span class="stat-label">Distance totale parcourue</span>
        <span class="stat-value sm" id="resKmTotal">0 km</span>
      </div>
    </div>

    <div class="km-section" id="kmSection" style="display:none">
      <h3>Frais kilométriques</h3>
      <div class="km-row" id="kmChauffeurRow">
        <span class="km-label">Conducteur (<span id="kmChauffeurKm">0</span> km × <span id="tarifChauffeur">0.00</span> €)</span>
        <span class="km-val" id="kmChauffeurTotal">0.00 €</span>
      </div>
      <div class="km-row" id="kmAccomRow">
        <span class="km-label">Accompagnateur (<span id="kmAccomKm">0</span> km × <span id="tarifAccom">0.00</span> €)</span>
        <span class="km-val" id="kmAccomTotal">0.00 €</span>
      </div>
      <div class="km-row total">
        <span class="km-label">Total indemnité kilométrique</span>
        <span class="km-val" id="kmGrandTotal">0.00 €</span>
      </div>
    </div>

    <div class="actions-grid no-print">
      <button type="button" class="btn primary" onclick="window.print()">🖨️ Imprimer le résumé</button>
      <button type="button" class="btn secondary" onclick="editerFeuille()">✏️ Modifier la feuille</button>
    </div>
  </div>

  <script src="shared.js"></script>
  <script>
    let _config = { ...DEFAULT_CONFIG };
    let curMois = new Date().getMonth();
    let curAnnee = new Date().getFullYear();

    async function initialiser() {
      initNavBar("resume");
      _config = await loadConfig();

      const key = localStorage.getItem("heures_resume_key");
      if (key && key.startsWith("heures_v2_")) {
        const parts = key.split("_");
        curMois = parseInt(parts[2]);
        curAnnee = parseInt(parts[3]);
      }

      document.getElementById("selectMois").value = curMois;
      document.getElementById("annee").value = curAnnee;

      chargerResume();
    }

    function changerPeriode() {
      curMois = parseInt(document.getElementById("selectMois").value);
      curAnnee = parseInt(document.getElementById("annee").value);
      const key = getStorageKey(curMois, curAnnee);
      localStorage.setItem("heures_resume_key", key);
      chargerResume();
    }

    function editerFeuille() {
      localStorage.setItem("heures_nav", JSON.stringify({ mois: String(curMois), annee: String(curAnnee) }));
      window.location.href = "index.html";
    }

    function chargerResume() {
      const key = getStorageKey(curMois, curAnnee);
      const saved = localStorage.getItem(key);

      document.getElementById("resPeriode").textContent = `${MOIS_NOMS[curMois]} ${curAnnee}`;
      document.getElementById("resEntreprise").textContent = _config.nom_entreprise || "—";

      if (!saved) {
        document.getElementById("resNom").textContent = "—";
        document.getElementById("resPrenom").textContent = "—";
        document.getElementById("resTotal").textContent = "00:00";
        document.getElementById("resSup").textContent = "00:00";
        document.getElementById("resJours").textContent = "0 j";
        document.getElementById("resKmTotal").textContent = "0 km";
        document.getElementById("kmSection").style.display = "none";
        return;
      }

      const data = JSON.parse(saved);
      const tarifC = _config.tarif_km_chauffeur || 0;
      const tarifA = _config.tarif_km_accompagnateur || 0;
      const nom = (data.nom || "").trim();
      const prenom = (data.prenom || "").trim();

      document.getElementById("resNom").textContent = nom || "—";
      document.getElementById("resPrenom").textContent = prenom || "—";
      document.getElementById("resTotal").textContent = data.totalMois || "00:00";
      document.getElementById("resSup").textContent = data.heuresSup || "00:00";

      let jours = 0, kmTotal = 0, kmChauffeur = 0, kmAccom = 0;
      for (let j = 1; j <= 31; j++) {
        const tot = data[`total_${j}`];
        if (tot && tot !== "00:00" && tot !== "0:00") {
          jours++;
        }

        const km = parseFloat(data[`kms_${j}`] || 0) || 0;
        const chauff = (data[`chauffeur_${j}`] || "").trim();

        if (km > 0) {
          kmTotal += km;
          if (isChauffeur(chauff, nom, prenom)) {
            kmChauffeur += km;
          } else {
            kmAccom += km;
          }
        }
      }

      document.getElementById("resJours").textContent = `${jours} j`;
      document.getElementById("resKmTotal").textContent = `${kmTotal.toFixed(1)} km`;

      if ((tarifC > 0 || tarifA > 0) && kmTotal > 0) {
        const fraisC = kmChauffeur * tarifC;
        const fraisA = kmAccom * tarifA;
        const total = fraisC + fraisA;

        document.getElementById("kmSection").style.display = "block";
        document.getElementById("tarifChauffeur").textContent = tarifC.toFixed(2);
        document.getElementById("tarifAccom").textContent = tarifA.toFixed(2);
        document.getElementById("kmChauffeurKm").textContent = kmChauffeur.toFixed(1);
        document.getElementById("kmAccomKm").textContent = kmAccom.toFixed(1);
        document.getElementById("kmChauffeurTotal").textContent = fraisC.toFixed(2) + " €";
        document.getElementById("kmAccomTotal").textContent = fraisA.toFixed(2) + " €";
        document.getElementById("kmGrandTotal").textContent = total.toFixed(2) + " €";

        document.getElementById("kmChauffeurRow").style.display = (kmChauffeur > 0 ? "flex" : "none");
        document.getElementById("kmAccomRow").style.display = (kmAccom > 0 ? "flex" : "none");
      } else {
        document.getElementById("kmSection").style.display = "none";
      }
    }

    window.addEventListener("DOMContentLoaded", initialiser);
  </script>
</body>

</html>
