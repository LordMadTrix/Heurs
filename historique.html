<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <title>Historique des Prestations — Heures Mensuelles</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="shared.css" />
  <style>
    body {
      background: var(--bg-page);
      padding: 0 0 40px;
    }

    .container {
      max-width: 960px;
      margin: 30px auto;
      background: var(--bg-card);
      border-radius: var(--radius-md);
      padding: 24px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
    }

    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      gap: 15px;
      flex-wrap: wrap;
    }

    h1 {
      margin: 0;
      font-size: 22px;
      color: var(--primary);
      font-weight: 700;
    }

    .filter-bar {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .filter-bar input,
    .filter-bar select {
      height: 38px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 0 12px;
      font-family: inherit;
      font-size: 13px;
      background: #fff;
      color: var(--text-main);
      outline: none;
      transition: var(--transition);
    }

    .filter-bar input {
      flex: 1;
      min-width: 180px;
    }

    .filter-bar input:focus,
    .filter-bar select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-glow);
    }

    .table-scroll {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      border-radius: var(--radius-sm);
    }

    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      min-width: 680px;
    }

    thead th {
      background: var(--bg-page);
      font-size: 10px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 10px 14px;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }

    tbody td {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
      font-size: 13px;
    }

    tbody tr:last-child td {
      border-bottom: none;
    }

    tbody tr:hover {
      background: var(--bg-alt);
    }

    .val-accent {
      color: var(--primary);
      font-weight: 700;
      font-size: 14px;
    }

    .val-muted {
      color: var(--text-light);
    }

    .badge-mois {
      display: inline-block;
      background: var(--primary-light);
      color: var(--primary);
      border-radius: var(--radius-full);
      padding: 2px 10px;
      font-size: 12px;
      font-weight: 600;
    }

    .actions-cell {
      display: flex;
      gap: 6px;
      align-items: center;
      justify-content: flex-end;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }

    .empty-state .icon {
      font-size: 48px;
      margin-bottom: 12px;
    }

    .empty-state p {
      margin: 0;
      font-size: 15px;
    }

    .total-row {
      font-size: 12px;
      color: var(--text-muted);
      padding: 12px 16px;
      text-align: right;
      border-top: 1px solid var(--border);
      background: var(--bg-page);
    }

    /* ===== Graphique annuel ===== */
    .chart-card {
      background: var(--bg-card);
      border-radius: var(--radius-md);
      padding: 18px 20px;
      margin-bottom: 24px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
    }

    .chart-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      gap: 10px;
    }

    .chart-header h2 {
      margin: 0;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .chart-bars {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      height: 120px;
      padding-top: 10px;
    }

    .bar-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      height: 100%;
      gap: 4px;
      cursor: pointer;
      position: relative;
    }

    .bar-col:hover .bar {
      filter: brightness(1.15);
      transform: scaleY(1.03);
    }

    .bar-val {
      font-size: 9px;
      font-weight: 700;
      color: var(--primary);
      min-height: 12px;
      text-align: center;
      white-space: nowrap;
    }

    .bar {
      width: 100%;
      border-radius: 4px 4px 0 0;
      transition: height 0.3s ease, background 0.2s, transform 0.15s;
      min-height: 3px;
      transform-origin: bottom;
    }

    .bar.has-data  { background: var(--primary); }
    .bar.no-data   { background: var(--border); min-height: 3px; }
    .bar.cur-month { background: var(--success); }

    .bar-label {
      font-size: 10px;
      color: var(--text-muted);
      font-weight: 600;
      text-align: center;
      margin-top: 4px;
    }

    .bar-label.cur-month {
      color: var(--primary);
      font-weight: 700;
    }

    .chart-legend {
      display: flex;
      gap: 16px;
      margin-top: 12px;
      font-size: 11px;
      color: var(--text-muted);
      flex-wrap: wrap;
    }

    .legend-dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 2px;
      margin-right: 5px;
      vertical-align: middle;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="header-row">
      <h1>📋 Historique des Feuilles d'Heures</h1>
      <a href="index.html" class="btn primary no-print">+ Nouvelle saisie</a>
    </div>

    <!-- Graphique annuel -->
    <div class="chart-card no-print">
      <div class="chart-header">
        <h2>📈 Heures travaillées par mois</h2>
        <select id="chartAnnee" onchange="renderChart()" style="height:32px; border:1px solid var(--border); border-radius:6px; padding:0 8px; font-family:inherit; font-size:12px; font-weight:600;"></select>
      </div>
      <div class="chart-bars" id="chartBars"></div>
      <div class="chart-legend">
        <span><span class="legend-dot" style="background:var(--primary)"></span>Heures enregistrées</span>
        <span><span class="legend-dot" style="background:var(--success)"></span>Mois en cours</span>
        <span><span class="legend-dot" style="background:var(--border)"></span>Aucune saisie</span>
      </div>
    </div>

    <!-- Filtres -->
    <div class="filter-bar no-print">
      <input type="text" id="searchInput" placeholder="🔍 Rechercher par nom ou prénom…" oninput="renderTable()" />
      <select id="filterAnnee" onchange="renderTable()">
        <option value="">Toutes les années</option>
      </select>
    </div>

    <div id="tableWrapper" class="table-scroll"></div>
  </div>

  <script src="shared.js"></script>
  <script>
    let allEntries = [];

    function loadAllEntries() {
      const entries = [];
      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        if (!key || !key.startsWith("heures_v2_")) continue;
        try {
          const data = JSON.parse(localStorage.getItem(key));
          const parts = key.split("_"); // ["heures", "v2", moisIdx, annee]
          const moisIdx = parseInt(parts[2]);
          const annee = parts[3];
          if (isNaN(moisIdx) || !annee || annee.length !== 4) continue;

          let kmTotal = 0;
          let joursTravailles = 0;
          for (let j = 1; j <= 31; j++) {
            const km = parseFloat(data[`kms_${j}`] || 0);
            if (!isNaN(km)) kmTotal += km;

            const tot = data[`total_${j}`];
            if (tot && tot !== "00:00" && tot !== "0:00") {
              joursTravailles++;
            }
          }

          entries.push({
            key,
            moisIdx,
            annee,
            kmTotal: kmTotal.toFixed(1),
            joursTravailles,
            nom: (data.nom || "").trim(),
            prenom: (data.prenom || "").trim(),
            total: data.totalMois || "00:00",
            sup: data.heuresSup || "00:00"
          });
        } catch (e) {}
      }

      entries.sort((a, b) => (+b.annee - +a.annee) || (b.moisIdx - a.moisIdx));
      return entries;
    }

    function chargerFeuille(key) {
      const parts = key.split("_");
      localStorage.setItem("heures_nav", JSON.stringify({ mois: parts[2], annee: parts[3] }));
      window.location.href = "index.html";
    }

    function supprimerFeuille(key, label) {
      if (confirm(`Voulez-vous supprimer définitivement la feuille :\n${label} ?`)) {
        localStorage.removeItem(key);
        showToast("Feuille supprimée", "info");
        initHistory();
      }
    }

    function renderTable() {
      const wrapper = document.getElementById("tableWrapper");
      const search = (document.getElementById("searchInput")?.value || "").toLowerCase().trim();
      const anneeFilter = document.getElementById("filterAnnee")?.value || "";

      const filtered = allEntries.filter(e => {
        if (anneeFilter && e.annee !== anneeFilter) return false;
        if (search) {
          const matchNom = e.nom.toLowerCase().includes(search);
          const matchPrenom = e.prenom.toLowerCase().includes(search);
          const matchMois = (MOIS_NOMS[e.moisIdx] || "").toLowerCase().includes(search);
          if (!matchNom && !matchPrenom && !matchMois) return false;
        }
        return true;
      });

      if (filtered.length === 0) {
        wrapper.innerHTML = `
          <div class="empty-state">
            <div class="icon">📂</div>
            <p>Aucune feuille d'heures trouvée.</p>
            <p style="margin-top:10px;"><a href="index.html" class="btn primary sm">Ouvrir le formulaire de saisie</a></p>
          </div>`;
        return;
      }

      const rows = filtered.map(e => {
        const moisLabel = MOIS_NOMS[e.moisIdx] || "?";
        const nomComplet = [e.nom, e.prenom].filter(Boolean).join(" ") || "Sans nom";
        const displayLabel = `${nomComplet} — ${moisLabel} ${e.annee}`;
        return `
          <tr>
            <td><strong>${escapeHTML(e.nom || "—")}</strong> ${escapeHTML(e.prenom || "")}</td>
            <td><span class="badge-mois">${moisLabel}</span></td>
            <td><strong>${e.annee}</strong></td>
            <td>${e.joursTravailles > 0 ? e.joursTravailles + " j" : '<span class="val-muted">—</span>'}</td>
            <td class="val-accent">${e.total}</td>
            <td>${e.sup !== "00:00" ? e.sup : '<span class="val-muted">—</span>'}</td>
            <td>${+e.kmTotal > 0 ? e.kmTotal + " km" : '<span class="val-muted">—</span>'}</td>
            <td class="no-print">
              <div class="actions-cell">
                <button class="btn success sm" onclick="chargerFeuille('${e.key}')">📂 Ouvrir</button>
                <button class="btn danger sm" onclick="supprimerFeuille('${e.key}', '${displayLabel.replace(/'/g, "\\'")}')" title="Supprimer">🗑️</button>
              </div>
            </td>
          </tr>`;
      }).join("");

      wrapper.innerHTML = `
        <table>
          <thead>
            <tr>
              <th>Ouvrier</th>
              <th>Mois</th>
              <th>Année</th>
              <th>Jours</th>
              <th>Total heures</th>
              <th>Heures sup</th>
              <th>Kilomètres</th>
              <th class="no-print" style="width:140px; text-align:right;">Actions</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
        <div class="total-row no-print">
          ${filtered.length} feuille${filtered.length > 1 ? "s" : ""} affichée${filtered.length > 1 ? "s" : ""}
        </div>`;
    }

    function initFilters() {
      const filterSel = document.getElementById("filterAnnee");
      const chartSel = document.getElementById("chartAnnee");
      const years = new Set();
      years.add(new Date().getFullYear());

      allEntries.forEach(e => {
        const y = parseInt(e.annee);
        if (y > 2000 && y < 2100) years.add(y);
      });

      const sortedYears = [...years].sort((a, b) => b - a);

      filterSel.innerHTML = '<option value="">Toutes les années</option>' +
        sortedYears.map(y => `<option value="${y}">${y}</option>`).join("");

      chartSel.innerHTML = sortedYears.map(y => `<option value="${y}">${y}</option>`).join("");
    }

    function renderChart() {
      const annee = parseInt(document.getElementById("chartAnnee").value);
      const curMois = new Date().getMonth();
      const curAnnee = new Date().getFullYear();
      const container = document.getElementById("chartBars");

      const heures = [];
      for (let m = 0; m <= 11; m++) {
        const key = getStorageKey(m, annee);
        const data = localStorage.getItem(key);
        if (data) {
          try {
            const parsed = JSON.parse(data);
            heures.push(parseHM(parsed.totalMois || ""));
          } catch (e) {
            heures.push(0);
          }
        } else {
          heures.push(0);
        }
      }

      const maxH = Math.max(...heures, 1);

      container.innerHTML = heures.map((h, m) => {
        const pct = Math.round((h / maxH) * 100);
        const isCur = (m === curMois && annee === curAnnee);
        const hasData = (h > 0);
        const cls = isCur ? "cur-month" : (hasData ? "has-data" : "no-data");
        const label = hasData ? (Number.isInteger(h) ? h + "h" : h.toFixed(1) + "h") : "";
        const hauteur = hasData ? Math.max(pct, 8) : 3;

        return `
          <div class="bar-col" onclick="chargerMoisDirect(${m}, ${annee})" title="${MOIS_NOMS[m]} ${annee}${hasData ? ' — ' + label : ''}">
            <div class="bar-val">${label}</div>
            <div class="bar ${cls}" style="height:${hauteur}%"></div>
            <div class="bar-label${isCur ? ' cur-month' : ''}">${MOIS_COURTS[m]}</div>
          </div>`;
      }).join("");
    }

    function chargerMoisDirect(mois, annee) {
      const key = getStorageKey(mois, annee);
      localStorage.setItem("heures_nav", JSON.stringify({ mois: String(mois), annee: String(annee) }));
      window.location.href = "index.html";
    }

    function initHistory() {
      allEntries = loadAllEntries();
      initFilters();
      renderChart();
      renderTable();
    }

    window.addEventListener("DOMContentLoaded", () => {
      initNavBar("historique");
      initHistory();
    });
  </script>
</body>

</html>
